[project]
name = "livemap"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dim4ik-creator", email = "litvinov06062006@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "geoalchemy2>=0.20.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-core>=2.46.4",
    "pydantic-settings>=2.15.0",
    "shapely>=2.1.2",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
livemap = "livemap:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
