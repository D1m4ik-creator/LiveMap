[project]
name = "livemap"
version = "0.1.0"
description = "Interactive map of public live cameras in Russia"
readme = "README.md"
authors = [
    { name = "Dim4ik-creator", email = "litvinov06062006@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "geoalchemy2>=0.20.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-core>=2.46.4",
    "pydantic-settings>=2.15.0",
    "shapely>=2.1.2",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.41.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.0",
]

[project.scripts]
livemap = "livemap:main"
livemap-admin = "livemap.admin_cli:main"
livemap-worker = "livemap.worker:main"
livemap-seed-candidates = "livemap.seed_candidates:main"
livemap-seed-verified = "livemap.seed_verified:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
