services:
  - type: web
    name: livemap-demo
    runtime: python
    plan: free
    region: frankfurt
    branch: codex/livemap-foundation
    buildCommand: sh scripts/render-build.sh
    startCommand: sh scripts/render-start.sh
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.15"
      - key: UV_VERSION
        value: "0.12.5"
      - key: NODE_VERSION
        value: "22"
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_HOST
        sync: false
      - key: DATABASE_SCHEMA
        value: livemap
      - key: POSTGRES_MIGRATION_USER
        sync: false
      - key: POSTGRES_MIGRATION_PASSWORD
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_SSL
        value: "true"
      - key: POSTGRES_SSL_CA_FILE
        value: deploy/certs/supabase-prod-ca-2021.crt
      - key: POSTGRES_SSL_LEGACY_CA
        value: "true"
      - key: SERVE_FRONTEND
        value: "true"
      - key: EMBEDDED_WORKER
        value: "true"
      - key: VITE_MAPTILER_KEY
        sync: false
